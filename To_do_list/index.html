<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    
    <h1>My To-Do List</h1>

    <!-- Input Section -->
    <div class="input-section">
    <input type="text" id="taskInput" placeholder="Enter a new task...">
    <input type="date" id="deadlineDate">
    <input type="time" id="deadlineTime">
    <button id="addBtn">Add this task</button>
    </div>

    <hr>

    <!-- Active Tasks -->
    <h2>📋 Active Tasks</h2>
    <ul id="taskList"></ul>

    <hr>

    <!-- Completed -->
    <h2>✅ Completed</h2>
    <table id="completedTable">
    <tr><th>Task</th><th>Deadline</th><th>Date Completed</th></tr>
    </table>

    <hr>

    <!-- Give Up -->
    <h2>❌ Give Up</h2>
    <table id="giveUpTable">
    <tr><th>Task</th><th>Deadline</th><th>Date Given Up</th></tr>
    </table>

    <hr>
    
    <!-- Clear All Button -->
    <button id="clearBtn">Clear All</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
